<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Список справ</title>
</head>
<body>
  <main class="container" style="max-width: 760px;">
    <h1 class="mt-5 mb-3">Мій список справ</h1>
    <div class="mb-3">
      <span class="me-3">Усього справ: <strong id="item-count">0</strong></span>
      <span>Невиконаних: <strong id="unchecked-count">0</strong></span>
    </div>
    <button class="btn btn-primary mb-3" type="button" onclick="newTodo()">Додати справу</button>
    <ul id="todo-list" class="list-group" aria-label="Список справ"></ul>
    <p id="empty-message" class="text-secondary mt-3">Справ поки немає.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
